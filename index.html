<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efe6">
  <meta name="description" content="cwy 常用工具：简单、好用的日常计算工具。">
  <title>cwy · 常用工具</title>
  <style>
    :root { --paper:#f4efe6; --ink:#18221d; --muted:#68726b; --line:#cfc7b9; --green:#1e5b43; --card:#fffdf8; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    a { color:inherit; text-decoration:none; }
    .shell { width:min(1080px, calc(100% - 40px)); margin:auto; }
    nav { height:88px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
    .brand { font:800 31px/1 Georgia,serif; letter-spacing:-1px; }
    .brand i { color:var(--green); }
    .navlinks { display:flex; gap:28px; color:var(--muted); font-size:16px; }
    .hero { padding:90px 0 78px; display:grid; grid-template-columns:1.2fr .8fr; gap:54px; align-items:end; }
    .eyebrow { margin:0 0 20px; color:var(--green); font-size:13px; font-weight:800; letter-spacing:2.6px; }
    h1 { margin:0; max-width:720px; font:700 clamp(52px, 8vw, 102px)/.98 Georgia,"Songti SC",serif; letter-spacing:-4px; }
    h1 em { color:var(--green); font-style:italic; }
    .intro { padding-bottom:8px; }
    .intro p { margin:0 0 30px; color:var(--muted); font-size:18px; line-height:1.85; }
    .button { display:inline-flex; align-items:center; gap:14px; padding:15px 22px; border-radius:999px; background:var(--ink); color:white; font-weight:700; }
    .tools { padding:48px 0 96px; border-top:1px solid var(--line); }
    .section-title { display:flex; align-items:end; justify-content:space-between; margin-bottom:26px; }
    .section-title span { color:var(--green); font:700 13px/1 monospace; }
    h2 { margin:7px 0 0; font:700 31px/1.2 Georgia,"Songti SC",serif; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:32px; display:grid; grid-template-columns:72px 1fr auto; gap:24px; align-items:center; transition:.2s ease; box-shadow:0 8px 30px rgba(25,34,29,.04); }
    .card:hover { transform:translateY(-3px); border-color:#8fa395; box-shadow:0 16px 38px rgba(25,34,29,.09); }
    .icon { width:64px; height:64px; display:grid; place-items:center; border-radius:18px; background:#dfe9e1; color:var(--green); font-size:27px; font-weight:800; }
    .card small { color:var(--green); font-weight:800; letter-spacing:1.5px; }
    .card h3 { margin:7px 0 7px; font-size:25px; }
    .card p { margin:0; color:var(--muted); line-height:1.7; }
    .arrow { font-size:27px; }
    footer { padding:28px 0 40px; border-top:1px solid var(--line); display:flex; justify-content:space-between; color:var(--muted); font-size:14px; }
    @media (max-width:760px) {
      .shell { width:min(100% - 28px, 1080px); }
      nav { height:72px; }
      .navlinks { gap:18px; font-size:15px; }
      .hero { grid-template-columns:1fr; padding:60px 0; gap:34px; }
      h1 { letter-spacing:-2px; }
      .tools { padding:36px 0 70px; }
      .card { grid-template-columns:56px 1fr; padding:23px 20px; gap:16px; }
      .icon { width:54px; height:54px; border-radius:15px; }
      .arrow { display:none; }
      .card h3 { font-size:21px; }
      footer { gap:16px; flex-direction:column; }
    }
  </style>
</head>
<body>
  <nav class="shell" aria-label="主导航">
    <a class="brand" href="./">cwy<i>.</i></a>
    <div class="navlinks"><a href="./">首页</a><a href="#tools">常用工具</a></div>
  </nav>

  <main>
    <section class="hero shell">
      <div>
        <p class="eyebrow">CWY · PERSONAL TOOLBOX</p>
        <h1>简单、好用的<br><em>日常工具。</em></h1>
      </div>
      <div class="intro">
        <p>把经常需要的计算与小功能放在一个地方。无需安装，打开即用。</p>
        <a class="button" href="#tools">查看常用工具 <span>↓</span></a>
      </div>
    </section>

    <section class="tools shell" id="tools" aria-labelledby="tools-title">
      <div class="section-title">
        <div><span>01 / TOOLS</span><h2 id="tools-title">常用工具</h2></div>
      </div>
      <a class="card" href="planner.html">
        <div class="icon" aria-hidden="true">存</div>
        <div>
          <small>FINANCE · 01</small>
          <h3>定存规划器</h3>
          <p>计算持续存入、停止注资后的续存、到期利息与累计资产明细。</p>
        </div>
        <div class="arrow" aria-hidden="true">→</div>
      </a>
    </section>
  </main>

  <footer class="shell"><span>© 2026 cwy</span><span>持续加入实用的小工具</span></footer>
</body>
</html>
